<svg width="1080" height="560" viewBox="0 0 1080 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#00000012"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0 0 L10 3.5 L0 7 Z" fill="#9ca3af"/>
    </marker>
    <marker id="arrowDown" viewBox="0 0 7 10" refX="3.5" refY="9" markerWidth="6" markerHeight="8" orient="auto">
      <path d="M0 0 L7 0 L3.5 10 Z" fill="#9ca3af"/>
    </marker>
    <linearGradient id="gradLayout" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
    <linearGradient id="gradPaint" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#EF4444"/><stop offset="100%" stop-color="#DC2626"/></linearGradient>
    <linearGradient id="gradComposite" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient>
  </defs>

  <rect width="1080" height="560" rx="14" fill="#fafbfc" stroke="#e2e4e9" stroke-width="1"/>

  <text x="540" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#111827">Reflow, Repaint &amp; Layout Thrashing</text>
  <text x="540" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280">Which rendering pipeline steps your CSS changes actually trigger — and how to avoid forcing them synchronously</text>

  <!-- PIPELINE COST PYRAMID -->
  <text x="60" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#111827">Pipeline Cost by Property Type</text>

  <!-- Compositor-only (cheapest) -->
  <rect x="60" y="112" width="320" height="48" rx="7" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="60" y="112" width="5" height="48" rx="2.5" fill="url(#gradComposite)"/>
  <text x="82" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Compositor-Only</text>
  <text x="195" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">— cheapest, runs off main thread</text>
  <text x="82" y="152" font-family="monospace" font-size="11" font-weight="600" fill="#8B5CF6">transform opacity</text>

  <!-- Repaint only (medium) -->
  <rect x="60" y="170" width="320" height="48" rx="7" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="60" y="170" width="5" height="48" rx="2.5" fill="url(#gradPaint)"/>
  <text x="82" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Repaint Only</text>
  <text x="175" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">— skips layout, still runs paint</text>
  <text x="82" y="210" font-family="monospace" font-size="11" font-weight="600" fill="#EF4444">color background-color box-shadow visibility</text>

  <!-- Reflow (most expensive) -->
  <rect x="60" y="228" width="320" height="48" rx="7" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="60" y="228" width="5" height="48" rx="2.5" fill="url(#gradLayout)"/>
  <text x="82" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Reflow (Layout)</text>
  <text x="180" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">— triggers full geometry recalc</text>
  <text x="82" y="268" font-family="monospace" font-size="11" font-weight="600" fill="#F59E0B">width height padding margin top left font-size display</text>

  <!-- FLOW DIAGRAM: Full Pipeline -->
  <text x="440" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#111827">What Runs in Each Step</text>

  <!-- Flow cards -->
  <rect x="440" y="115" width="100" height="50" rx="7" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="440" y="115" width="5" height="50" rx="2.5" fill="url(#gradLayout)"/>
  <text x="480" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1f2937">Layout</text>
  <text x="480" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">Geometry calc</text>

  <line x1="540" y1="140" x2="560" y2="140" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="566" y="115" width="100" height="50" rx="7" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="566" y="115" width="5" height="50" rx="2.5" fill="url(#gradPaint)"/>
  <text x="606" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1f2937">Paint</text>
  <text x="606" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">Fill pixels</text>

  <line x1="666" y1="140" x2="686" y2="140" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="692" y="115" width="110" height="50" rx="7" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="692" y="115" width="5" height="50" rx="2.5" fill="url(#gradComposite)"/>
  <text x="740" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1f2937">Composite</text>
  <text x="740" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">Layer merge</text>

  <!-- Main thread indicator -->
  <rect x="435" y="178" width="380" height="20" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="625" y="192" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#d97706">MAIN THREAD</text>

  <!-- Divider -->
  <line x1="60" y1="310" x2="1020" y2="310" stroke="#e5e7eb" stroke-width="1"/>

  <!-- LAYOUT THRASHING SECTION -->
  <text x="60" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#111827">Layout Thrashing</text>
  <text x="205" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280">— interleaving reads and writes forces repeated synchronous layouts</text>

  <!-- Bad pattern -->
  <text x="60" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#dc2626">Bad — Read / Write interleaved in a loop</text>
  <g transform="translate(60, 392)">
    <!-- Loop visualization -->
    <rect x="0" y="0" width="60" height="22" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="30" y="15" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#dc2626">READ</text>
    <line x1="60" y1="11" x2="80" y2="11" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="80" y="0" width="60" height="22" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="110" y="15" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#dc2626">WRITE</text>
    <line x1="140" y1="11" x2="160" y2="11" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="160" y="0" width="60" height="22" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="190" y="15" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#dc2626">READ</text>
    <line x1="220" y1="11" x2="240" y2="11" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="240" y="0" width="60" height="22" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="270" y="15" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#dc2626">WRITE</text>
    <line x1="300" y1="11" x2="320" y2="11" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="320" y="0" width="60" height="22" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="350" y="15" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#dc2626">READ</text>
    <line x1="380" y1="11" x2="400" y2="11" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="400" y="0" width="60" height="22" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="430" y="15" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#dc2626">WRITE</text>
    <text x="480" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af">...</text>

    <!-- Layout recalc markers below -->
    <text x="30" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#dc2626">Layout</text>
    <line x1="30" y1="28" x2="30" y2="32" stroke="#dc2626" stroke-width="0.8"/>
    <text x="110" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#dc2626">Layout</text>
    <line x1="110" y1="28" x2="110" y2="32" stroke="#dc2626" stroke-width="0.8"/>
    <text x="190" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#dc2626">Layout</text>
    <line x1="190" y1="28" x2="190" y2="32" stroke="#dc2626" stroke-width="0.8"/>
    <text x="270" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#dc2626">Layout</text>
    <line x1="270" y1="28" x2="270" y2="32" stroke="#dc2626" stroke-width="0.8"/>
    <text x="350" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#dc2626">Layout</text>
    <line x1="350" y1="28" x2="350" y2="32" stroke="#dc2626" stroke-width="0.8"/>
    <text x="430" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#dc2626">Layout</text>
    <line x1="430" y1="28" x2="430" y2="32" stroke="#dc2626" stroke-width="0.8"/>

    <text x="240" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#dc2626">N items = N forced synchronous layouts</text>
  </g>

  <!-- Good pattern -->
  <text x="60" y="486" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#059669">Good — Batch all reads, then all writes</text>
  <g transform="translate(60, 500)">
    <rect x="0" y="0" width="120" height="22" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="0.8"/>
    <text x="60" y="15" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#059669">READ ALL</text>
    <line x1="120" y1="11" x2="140" y2="11" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="140" y="0" width="120" height="22" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="0.8"/>
    <text x="200" y="15" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#059669">WRITE ALL</text>
    <text x="290" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">→ Layout recalculates once</text>

    <text x="60" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#059669">Layout</text>
    <line x1="60" y1="28" x2="60" y2="32" stroke="#10B981" stroke-width="0.8"/>
  </g>
</svg>
