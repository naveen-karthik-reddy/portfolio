<svg width="1080" height="530" viewBox="0 0 1080 530" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#00000012"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0 0 L10 3.5 L0 7 Z" fill="#9ca3af"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0 0 L10 3.5 L0 7 Z" fill="#EF4444"/>
    </marker>
    <linearGradient id="gradParse" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="gradCssom" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#4F46E5"/></linearGradient>
    <linearGradient id="gradMerge" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="gradLayout" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
    <linearGradient id="gradPaint" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#EF4444"/><stop offset="100%" stop-color="#DC2626"/></linearGradient>
    <linearGradient id="gradCritical" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef2f2" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fef2f2" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="530" rx="14" fill="#fafbfc" stroke="#e2e4e9" stroke-width="1"/>

  <text x="540" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#111827">Critical Rendering Path</text>
  <text x="540" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280">The minimum work the browser must finish before it can show the user anything — every step is a potential bottleneck</text>

  <!-- CRITICAL PATH BACKGROUND BAND -->
  <rect x="60" y="82" width="960" height="170" rx="10" fill="url(#gradCritical)" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="540" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#dc2626" letter-spacing="0.8">CRITICAL PATH — BLOCKS FIRST PAINT</text>

  <!-- Row 1: HTML → DOM + CSS → CSSOM -->
  <!-- HTML -->
  <rect x="80" y="116" width="112" height="50" rx="7" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="80" y="116" width="5" height="50" rx="2.5" fill="url(#gradParse)"/>
  <circle cx="98" cy="136" r="10" fill="#3B82F6"/>
  <text x="98" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#fff">1</text>
  <text x="116" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1f2937">Fetch HTML</text>
  <text x="116" y="155" font-family="monospace" font-size="10" font-weight="600" fill="#3B82F6">→ DOM</text>

  <line x1="192" y1="141" x2="222" y2="141" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Parse HTML -->
  <rect x="228" y="116" width="112" height="50" rx="7" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="228" y="116" width="5" height="50" rx="2.5" fill="url(#gradParse)"/>
  <circle cx="246" cy="136" r="10" fill="#3B82F6"/>
  <text x="246" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#fff">2</text>
  <text x="264" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1f2937">Parse HTML</text>
  <text x="264" y="155" font-family="monospace" font-size="10" font-weight="600" fill="#3B82F6">→ DOM Tree</text>

  <!-- BLOCKING SCRIPT - red interruption -->
  <rect x="365" y="108" width="140" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="435" y="122" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#dc2626">⚠ Blocking Script</text>
  <text x="435" y="136" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#991b1b">pauses parser</text>
  <line x1="505" y1="126" x2="530" y2="126" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>

  <!-- CSS Row -->
  <rect x="80" y="182" width="112" height="50" rx="7" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="80" y="182" width="5" height="50" rx="2.5" fill="url(#gradCssom)"/>
  <circle cx="98" cy="202" r="10" fill="#6366F1"/>
  <text x="98" y="206" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#fff">3</text>
  <text x="116" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1f2937">Fetch CSS</text>
  <text x="116" y="221" font-family="monospace" font-size="10" font-weight="600" fill="#6366F1">→ CSSOM</text>

  <line x1="192" y1="207" x2="222" y2="207" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Parse CSS -->
  <rect x="228" y="182" width="112" height="50" rx="7" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="228" y="182" width="5" height="50" rx="2.5" fill="url(#gradCssom)"/>
  <circle cx="246" cy="202" r="10" fill="#6366F1"/>
  <text x="246" y="206" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#fff">4</text>
  <text x="264" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1f2937">Parse CSS</text>
  <text x="264" y="221" font-family="monospace" font-size="10" font-weight="600" fill="#6366F1">→ CSSOM Tree</text>

  <!-- Merge arrows -->
  <path d="M340 141 C360 141, 360 170, 380 170" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 207 C360 207, 360 178, 380 178" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2: Merge → Layout → Paint → First Paint -->
  <rect x="400" y="145" width="115" height="50" rx="7" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="400" y="145" width="5" height="50" rx="2.5" fill="url(#gradMerge)"/>
  <circle cx="418" cy="165" r="10" fill="#10B981"/>
  <text x="418" y="169" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#fff">5</text>
  <text x="436" y="169" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1f2937">Render Tree</text>
  <text x="436" y="184" font-family="monospace" font-size="10" font-weight="600" fill="#10B981">Merge DOM+CSSOM</text>

  <line x1="515" y1="170" x2="540" y2="170" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="546" y="145" width="95" height="50" rx="7" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="546" y="145" width="5" height="50" rx="2.5" fill="url(#gradLayout)"/>
  <circle cx="564" cy="165" r="10" fill="#F59E0B"/>
  <text x="564" y="169" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#fff">6</text>
  <text x="584" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1f2937">Layout</text>
  <text x="584" y="180" font-family="monospace" font-size="10" font-weight="600" fill="#F59E0B">→ Box Model</text>

  <line x1="641" y1="170" x2="666" y2="170" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="672" y="145" width="95" height="50" rx="7" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="672" y="145" width="5" height="50" rx="2.5" fill="url(#gradPaint)"/>
  <circle cx="690" cy="165" r="10" fill="#EF4444"/>
  <text x="690" y="169" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#fff">7</text>
  <text x="710" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1f2937">Paint</text>
  <text x="710" y="180" font-family="monospace" font-size="10" font-weight="600" fill="#EF4444">→ Draw Calls</text>

  <line x1="767" y1="170" x2="792" y2="170" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- First Paint -->
  <g transform="translate(798, 145)">
    <rect x="0" y="0" width="100" height="50" rx="7" fill="#dcfce7" stroke="#86efac" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="50" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#166534">First Paint</text>
    <text x="50" y="39" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#15803d">Pixels on screen</text>
  </g>

  <!-- Divider -->
  <line x1="60" y1="280" x2="1020" y2="280" stroke="#e5e7eb" stroke-width="1"/>

  <!-- BOTTOM: Optimisation strategies -->
  <text x="60" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#111827">Shortening the Critical Path</text>
  <text x="245" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280">— three strategies to remove bottlenecks</text>

  <!-- Strategy 1: defer scripts -->
  <rect x="60" y="340" width="300" height="80" rx="7" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="60" y="340" width="5" height="80" rx="2.5" fill="url(#gradParse)"/>
  <text x="82" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Add defer to scripts</text>
  <text x="82" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">Stops parser blocking — scripts run</text>
  <text x="82" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">after HTML parsing is complete</text>
  <text x="310" y="397" font-family="monospace" font-size="12" font-weight="700" fill="#3B82F6">defer</text>

  <!-- Strategy 2: inline critical CSS -->
  <rect x="390" y="340" width="300" height="80" rx="7" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="390" y="340" width="5" height="80" rx="2.5" fill="url(#gradCssom)"/>
  <text x="412" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Inline critical CSS</text>
  <text x="412" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">Eliminates stylesheet round-trip for</text>
  <text x="412" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">above-the-fold content only</text>
  <text x="638" y="397" font-family="monospace" font-size="12" font-weight="700" fill="#6366F1">&lt;style&gt;</text>

  <!-- Strategy 3: async non-critical CSS -->
  <rect x="720" y="340" width="300" height="80" rx="7" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="720" y="340" width="5" height="80" rx="2.5" fill="url(#gradMerge)"/>
  <text x="742" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Async non-critical CSS</text>
  <text x="742" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">Load the rest after first paint via</text>
  <text x="742" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">the media="print" → onload trick</text>
  <text x="960" y="397" font-family="monospace" font-size="12" font-weight="700" fill="#10B981">media="print"</text>

  <!-- Bottom timeline: before vs after -->
  <text x="60" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#111827">Before:</text>
  <g transform="translate(130, 448)">
    <rect x="0" y="0" width="280" height="16" rx="4" fill="#ef4444"/>
    <rect x="280" y="0" width="130" height="16" rx="4" fill="#f59e0b"/>
    <rect x="410" y="0" width="170" height="16" fill="#22c55e"/>
    <rect x="580" y="0" width="80" height="16" rx="4" fill="#e5e7eb"/>
    <text x="50" y="-8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#991b1b">Blocked</text>
    <text x="300" y="-8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#92400e">Layout</text>
    <text x="450" y="-8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#166534">Paint</text>
    <text x="620" y="-8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#6b7280">FP</text>
  </g>

  <text x="60" y="492" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#111827">After:</text>
  <g transform="translate(130, 482)">
    <rect x="0" y="0" width="80" height="16" rx="4" fill="#3B82F6"/>
    <rect x="80" y="0" width="40" height="16" rx="4" fill="#e5e7eb"/>
    <rect x="120" y="0" width="130" height="16" rx="4" fill="#f59e0b"/>
    <rect x="250" y="0" width="170" height="16" fill="#22c55e"/>
    <rect x="420" y="0" width="80" height="16" rx="4" fill="#e5e7eb"/>
    <text x="40" y="-8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#1e40af">HTML+CSS</text>
    <text x="260" y="-8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#92400e">Layout</text>
    <text x="370" y="-8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#166534">Paint</text>
    <text x="460" y="-8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#6b7280">FP</text>
  </g>
</svg>
